<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Open in Obsidian</title>
  <style>
    :root { color-scheme: dark light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 15px/1.5 system-ui, sans-serif; background: #0b0d12; color: #d6dae4; }
    @media (prefers-color-scheme: light) { body { background: #f6f7fa; color: #1b1f2a; } }
    main { padding: 16px; text-align: center; }
    a { color: #a78bfa; }
  </style>
</head>
<body>
  <main>
    <p id="msg">Opening in Obsidian…</p>
    <p><a id="link" hidden>Open in Obsidian</a></p>
  </main>
  <script>
    // Hands an https link over to Obsidian: /obsidian.html#vault=Life&file=Folder%2FNote
    // The note lives in the fragment, so it never reaches the server or its logs.
    // Only vault and file are passed on, so this can't be used to open anything but obsidian://open.
    (function () {
      var hash = new URLSearchParams(location.hash.slice(1));
      var target = new URLSearchParams();
      if (hash.get('vault')) target.set('vault', hash.get('vault'));
      if (hash.get('file')) target.set('file', hash.get('file'));
      var msg = document.getElementById('msg');
      if (!target.get('file')) {
        msg.textContent = 'No note given.';
        return;
      }
      var uri = 'obsidian://open?' + target.toString().replace(/\+/g, '%20');
      var link = document.getElementById('link');
      link.href = uri;
      link.hidden = false;

      // Browsers only let a page close a tab that has nothing to go back to,
      // which is the case for a link opened in a new tab.
      function done() {
        window.close();
        msg.textContent = 'Opened in Obsidian. You can close this tab.';
      }
      window.addEventListener('blur', function () { setTimeout(done, 300); }, { once: true });
      setTimeout(done, 5000);
      location.href = uri;
    })();
  </script>
</body>
</html>
